name: Terraform CI/CD

# TRIGGER: run on every push to main
on:
  push:
    branches: [ main ]

# Give the job AWS credentials from your GitHub Secrets
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "us-east-1"     # match your main.tf region

jobs:
  terraform:
    name: Deploy Infra
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repo (main.tf) onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connect to AWS using your secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Install Terraform on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize (downloads AWS provider)
      - name: Terraform Init
        run: terraform init

      # 5. Check formatting (best practice, non-blocking)
      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      # 6. Validate syntax
      - name: Terraform Validate
        run: terraform validate

      # 7. PLAN — shows what WILL be built (your safety net — read this!)
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 8. APPLY — actually builds it on AWS (auto, as you asked)
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan