name: Terraform Cleanup

# Manual trigger ONLY — a button you click. NEVER runs automatically.
# You never want infrastructure destroyed on a push by accident.
on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: "us-east-1"          # must match your main.tf region

jobs:
  cleanup:
    name: Destroy AWS Infra
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your repo (main.tf, backend config) onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log into AWS using your stored secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Install Terraform on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Init — connects to state (S3 backend) so it KNOWS what exists
      - name: Terraform Init
        run: terraform init

      # 5. Destroy everything Terraform is tracking in state
      - name: Terraform Destroy
        run: terraform destroy -auto-approve